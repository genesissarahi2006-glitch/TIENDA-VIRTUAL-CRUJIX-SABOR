<title>CRUJIX SABOR | El sabor que nos une</title>

<style>
:root {
  --cream:#f8f5ed;
  --white:#fffefa;
  --green:#314b36;
  --green2:#526b46;
  --orange:#e78a36;
  --yellow:#f4c85a;
  --brown:#45352a;
  --muted:#82796d;
  --line:#e9e3d8;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html {scroll-behavior:smooth;}

body {
  background:var(--cream);
  color:var(--brown);
  font-family:'DM Sans',sans-serif;
}

button,input,select {font:inherit;}
button {cursor:pointer;}
a {color:inherit;text-decoration:none;}

.announcement {
  background:var(--green);
  color:white;
  text-align:center;
  padding:10px;
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
}

header {
  background:var(--white);
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--line);
}

.header-inner {
  max-width:1400px;
  min-height:82px;
  margin:auto;
  padding:12px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
}

.logo {
  font-size:26px;
  font-weight:800;
  letter-spacing:-1.5px;
  color:var(--green);
  white-space:nowrap;
}

.logo span {color:var(--orange);}

.logo small {
  display:block;
  font-size:9px;
  letter-spacing:3px;
  font-weight:600;
  text-align:center;
  color:var(--muted);
}

.nav {
  display:flex;
  gap:22px;
  align-items:center;
}

.nav a {
  font-size:12px;
  font-weight:700;
  transition:.2s;
}

.nav a:hover {color:var(--orange);}

.header-actions {
  display:flex;
  align-items:center;
  gap:17px;
}

.icon-btn {
  border:0;
  background:transparent;
  font-size:21px;
  color:var(--green);
  position:relative;
}

.cart-count {
  position:absolute;
  top:-8px;
  right:-10px;
  background:var(--orange);
  color:white;
  width:17px;
  height:17px;
  display:grid;
  place-items:center;
  border-radius:50%;
  font-size:10px;
}

.menu-toggle {
  display:none;
  border:0;
  background:none;
  font-size:25px;
  color:var(--green);
}

/* HERO */

.hero {
  max-width:1500px;
  margin:auto;
  padding:38px 5%;
}

.hero-card {
  min-height:520px;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#e9e6d9;
  overflow:hidden;
  border-radius:5px;
}

.hero-copy {
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:65px 10%;
}

.eyebrow {
  color:var(--green2);
  font-size:11px;
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:20px;
}

.hero h1 {
  font-family:'Playfair Display',serif;
  font-size:clamp(42px,5vw,70px);
  line-height:1.05;
  color:var(--green);
  margin-bottom:22px;
}

.hero h1 span {color:var(--orange);}

.hero-copy p {
  max-width:430px;
  font-size:15px;
  line-height:1.9;
  color:#625b50;
  margin-bottom:30px;
}

.primary-btn {
  display:inline-flex;
  justify-content:center;
  align-items:center;
  background:var(--green);
  color:white;
  border:0;
  padding:16px 25px;
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  width:max-content;
  transition:.25s;
}

.primary-btn:hover {
  background:var(--orange);
  transform:translateY(-3px);
}

.hero-image {
  min-height:520px;
  position:relative;
}

.hero-image img {
  width:100%;
  height:100%;
  position:absolute;
  object-fit:cover;
}

.hero-label {
  position:absolute;
  bottom:25px;
  left:25px;
  background:var(--white);
  padding:15px 20px;
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
}

/* BENEFICIOS */

.features {
  max-width:1300px;
  margin:auto;
  padding:20px 5% 65px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.feature {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:18px 10px;
  border-right:1px solid var(--line);
}

.feature:last-child {border:0;}

.feature-icon {font-size:25px;}

.feature strong {
  display:block;
  font-size:12px;
  color:var(--green);
}

.feature small {
  font-size:10px;
  color:var(--muted);
}

/* TITULOS */

.section {
  padding:85px 5%;
}

.container {
  max-width:1300px;
  margin:auto;
}

.section-heading {
  text-align:center;
  margin-bottom:40px;
}

.section-heading .eyebrow {margin-bottom:12px;}

.section-heading h2 {
  font-family:'Playfair Display',serif;
  color:var(--green);
  font-size:clamp(30px,4vw,44px);
  margin-bottom:12px;
}

.section-heading p {
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
}

/* CATEGORIAS */

.categories {
  background:var(--white);
}

.category-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.category {
  position:relative;
  height:260px;
  overflow:hidden;
  background:#e8dfcc;
  cursor:pointer;
}

.category img {
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.5s;
}

.category:hover img {transform:scale(1.07);}

.category-info {
  position:absolute;
  bottom:0;
  width:100%;
  padding:30px 15px 18px;
  background:linear-gradient(transparent,#0009);
  color:white;
}

.category-info h3 {
  font-family:'Playfair Display',serif;
  font-size:23px;
}

.category-info span {
  font-size:10px;
  letter-spacing:1px;
}

/* PRODUCTOS */

.products-section {background:var(--cream);}

.filters {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-bottom:35px;
}

  border:1px solid #d9d1c4;
